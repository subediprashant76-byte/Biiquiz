name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bequest-biiquiz-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_DIR: /home/nepgiftuser/host.biiquiz.com
  COMPOSE_PROJECT_NAME: hostbiiquizcom

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        shell: bash
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend API image
        shell: bash
        run: |
          docker build \
            --target runtime \
            -f backend/Dockerfile \
            -t "${IMAGE_PREFIX}-api:${IMAGE_TAG}" \
            -t "${IMAGE_PREFIX}-api:latest" \
            backend

          docker push "${IMAGE_PREFIX}-api:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-api:latest"

      - name: Build and push migration image
        shell: bash
        run: |
          docker build \
            --target migrations \
            -f backend/Dockerfile \
            -t "${IMAGE_PREFIX}-migrate:${IMAGE_TAG}" \
            -t "${IMAGE_PREFIX}-migrate:latest" \
            backend

          docker push "${IMAGE_PREFIX}-migrate:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-migrate:latest"

      - name: Build and push frontend image
        shell: bash
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg USE_DJANGO_API=true \
            --build-arg DJANGO_API_URL=https://hostapi.biiquiz.com \
            --build-arg NEXT_PUBLIC_APP_URL=https://host.biiquiz.com \
            --build-arg NEXT_PUBLIC_GEMINI_MODEL=gemini-2.5-flash \
            -t "${IMAGE_PREFIX}-frontend:${IMAGE_TAG}" \
            -t "${IMAGE_PREFIX}-frontend:latest" \
            .

          docker push "${IMAGE_PREFIX}-frontend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-frontend:latest"

      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on production server
        shell: bash
        run: |
          ssh -i ~/.ssh/production_key "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "IMAGE_PREFIX='${IMAGE_PREFIX}' IMAGE_TAG='${IMAGE_TAG}' GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_READ_TOKEN='${{ secrets.GHCR_READ_TOKEN }}' APP_DIR='${APP_DIR}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail

          COMPOSE_FILE="$APP_DIR/docker-compose.cicd.yml"
          PREVIOUS_COMPOSE_FILE="$APP_DIR/docker-compose.cicd.previous.yml"
          BACKUP_DIR="/srv/backups/biiquiz"

          cd "$APP_DIR"

          if [ -f "$COMPOSE_FILE" ]; then
            cp "$COMPOSE_FILE" "$PREVIOUS_COMPOSE_FILE"
          fi

          echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          cat > "$COMPOSE_FILE" <<EOF
          services:
            db:
              image: postgres:16
              restart: unless-stopped
              env_file:
                - /etc/biiquiz/host-api.env
              volumes:
                - biiquiz_postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
                interval: 10s
                timeout: 5s
                retries: 10

            migrate:
              image: ${IMAGE_PREFIX}-migrate:${IMAGE_TAG}
              env_file:
                - /etc/biiquiz/host-api.env
              depends_on:
                db:
                  condition: service_healthy
              restart: "no"

            api:
              image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
              restart: unless-stopped
              env_file:
                - /etc/biiquiz/host-api.env
              environment:
                GUNICORN_BIND: 0.0.0.0:8000
                HEALTHCHECK_HOST: hostapi.biiquiz.com
              depends_on:
                db:
                  condition: service_healthy
              ports:
                - "127.0.0.1:8765:8000"

            frontend:
              image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
              restart: unless-stopped
              env_file:
                - /etc/biiquiz/frontend.env
              depends_on:
                - api
              ports:
                - "127.0.0.1:3000:3000"

          volumes:
            biiquiz_postgres_data:
              name: hostbiiquizcom_biiquiz_postgres_data
          EOF

          sed -i 's/^          //' "$COMPOSE_FILE"

          COMPOSE=(docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE")

          "${COMPOSE[@]}" config
          "${COMPOSE[@]}" pull

          "${COMPOSE[@]}" up -d db

          echo "Waiting for database health..."
          for i in $(seq 1 30); do
            DB_STATUS="$(docker inspect --format='{{.State.Health.Status}}' "${COMPOSE_PROJECT_NAME}-db-1" 2>/dev/null || true)"
            if [ "$DB_STATUS" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          DB_STATUS="$(docker inspect --format='{{.State.Health.Status}}' "${COMPOSE_PROJECT_NAME}-db-1" 2>/dev/null || true)"
          if [ "$DB_STATUS" != "healthy" ]; then
            echo "Database did not become healthy."
            exit 1
          fi

          set -a
          . /etc/biiquiz/host-api.env
          set +a

          mkdir -p "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/predeploy-${IMAGE_TAG}-$(date +%F-%H%M%S).dump"

          "${COMPOSE[@]}" exec -T db \
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom \
            > "$BACKUP_FILE"

          echo "Database backup created: $BACKUP_FILE"

          "${COMPOSE[@]}" rm -f migrate || true
          "${COMPOSE[@]}" run --rm migrate

          "${COMPOSE[@]}" up -d api frontend --remove-orphans

          echo "Checking backend private health..."
          curl --fail \
            -H 'Host: hostapi.biiquiz.com' \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8765/api/health

          echo "Checking frontend private health..."
          curl --fail -I http://127.0.0.1:3000

          echo "Checking public frontend page through Nginx..."
          curl --fail -I https://host.biiquiz.com

          echo "Checking public same-origin API route through Nginx..."
          curl --fail https://host.biiquiz.com/api/health

          echo "Checking public dedicated API domain through Nginx..."
          curl --fail https://hostapi.biiquiz.com/api/health

          docker image prune -f

          echo "Deployment completed successfully: ${IMAGE_TAG}"
REMOTE
