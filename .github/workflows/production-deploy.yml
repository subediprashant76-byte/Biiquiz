name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bequest-biiquiz-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_DIR: /home/nepgiftuser/host.biiquiz.com
  COMPOSE_PROJECT_NAME: hostbiiquizcom

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        shell: bash
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"

          echo "IMAGE_PREFIX=ghcr.io/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build backend API image
        shell: bash
        run: |
          docker build \
            --target runtime \
            -f backend/Dockerfile \
            -t "${IMAGE_PREFIX}-api:${IMAGE_TAG}" \
            -t "${IMAGE_PREFIX}-api:latest" \
            backend

      - name: Push backend API image
        shell: bash
        run: |
          docker push "${IMAGE_PREFIX}-api:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-api:latest"

      - name: Build backend migration image
        shell: bash
        run: |
          docker build \
            --target migrations \
            -f backend/Dockerfile \
            -t "${IMAGE_PREFIX}-migrate:${IMAGE_TAG}" \
            -t "${IMAGE_PREFIX}-migrate:latest" \
            backend

      - name: Push backend migration image
        shell: bash
        run: |
          docker push "${IMAGE_PREFIX}-migrate:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-migrate:latest"

      - name: Build frontend image
        shell: bash
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg USE_DJANGO_API=true \
            --build-arg DJANGO_API_URL=https://hostapi.biiquiz.com \
            --build-arg NEXT_PUBLIC_APP_URL=https://host.biiquiz.com \
            --build-arg NEXT_PUBLIC_GEMINI_MODEL=gemini-2.5-flash \
            -t "${IMAGE_PREFIX}-frontend:${IMAGE_TAG}" \
            -t "${IMAGE_PREFIX}-frontend:latest" \
            .

      - name: Push frontend image
        shell: bash
        run: |
          docker push "${IMAGE_PREFIX}-frontend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}-frontend:latest"

      - name: Prepare SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "SERVER_SSH_KEY secret is empty or missing."
            exit 1
          fi

          if [ -z "$SERVER_HOST" ]; then
            echo "SERVER_HOST secret is empty or missing."
            exit 1
          fi

          if [ -z "$SERVER_PORT" ]; then
            echo "SERVER_PORT secret is empty or missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/production_key"
          chmod 600 "$HOME/.ssh/production_key"

          ssh-keygen -y -f "$HOME/.ssh/production_key" > /dev/null

          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Copy Compose file to server
        shell: bash
        run: |
          scp -P "${{ secrets.SERVER_PORT }}" \
            -i "$HOME/.ssh/production_key" \
            docker-compose.cicd.yml \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${APP_DIR}/docker-compose.cicd.yml"

      - name: Deploy on production server
        shell: bash
        run: |
          ssh -p "${{ secrets.SERVER_PORT }}" -i "$HOME/.ssh/production_key" "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "IMAGE_PREFIX='${IMAGE_PREFIX}' IMAGE_TAG='${IMAGE_TAG}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' APP_DIR='${APP_DIR}' GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_READ_TOKEN='${{ secrets.GHCR_READ_TOKEN }}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          COMPOSE_FILE="$APP_DIR/docker-compose.cicd.yml"
          BACKUP_DIR="/srv/backups/biiquiz"

          cd "$APP_DIR"

          echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          export IMAGE_PREFIX
          export IMAGE_TAG

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" config

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" pull

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d db

          echo "Waiting for database health..."

          for i in $(seq 1 30); do
            DB_STATUS="$(docker inspect --format='{{.State.Health.Status}}' "${COMPOSE_PROJECT_NAME}-db-1" 2>/dev/null || true)"

            if [ "$DB_STATUS" = "healthy" ]; then
              break
            fi

            sleep 2
          done

          DB_STATUS="$(docker inspect --format='{{.State.Health.Status}}' "${COMPOSE_PROJECT_NAME}-db-1" 2>/dev/null || true)"

          if [ "$DB_STATUS" != "healthy" ]; then
            echo "Database did not become healthy."
            exit 1
          fi

          set -a
          . /etc/biiquiz/host-api.env
          set +a

          mkdir -p "$BACKUP_DIR"

          BACKUP_FILE="$BACKUP_DIR/predeploy-${IMAGE_TAG}-$(date +%F-%H%M%S).dump"

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" exec -T db \
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom \
            > "$BACKUP_FILE"

          echo "Database backup created: $BACKUP_FILE"

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" rm -f migrate || true

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" run --rm migrate

          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d api frontend --remove-orphans

          echo "Checking backend private health..."
          curl --fail \
            -H 'Host: hostapi.biiquiz.com' \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8765/api/health

          echo "Checking frontend private health..."
          curl --fail -I http://127.0.0.1:3000

          echo "Checking public frontend..."
          curl --fail -I https://host.biiquiz.com

          echo "Checking frontend-domain API route..."
          curl --fail https://host.biiquiz.com/api/health

          echo "Checking public API domain..."
          curl --fail https://hostapi.biiquiz.com/api/health

          docker image prune -f

          echo "Deployment completed successfully: $IMAGE_TAG"
          REMOTE_SCRIPT
