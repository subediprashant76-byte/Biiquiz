name: Deploy Host BiiQuiz (Dokploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: host-biiquiz-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Dokploy Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_COMPOSE_ID" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "Missing one or more required secrets: DOKPLOY_URL, DOKPLOY_COMPOSE_ID, DOKPLOY_API_KEY"
            exit 1
          fi

          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${DOKPLOY_COMPOSE_ID}\"}"
