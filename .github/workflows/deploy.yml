name: Build and Deploy Host BiiQuiz

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: host-biiquiz-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: host-biiquiz-frontend
  BACKEND_IMAGE: host-biiquiz-backend
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  SERVER_APP_DIR: /home/nepgiftuser/projects/host.biiquiz/host.biiquiz.com

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Prepare Prisma client
        run: |
          rm -rf "$HOME/.cache/prisma"
          npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
          DIRECT_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db

      - name: Run frontend lint
        run: npm run lint --if-present

      - name: Run frontend build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          USE_DJANGO_API: "true"
          DJANGO_API_URL: http://127.0.0.1:8000

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "False"
      DJANGO_DEBUG: "false"
      SECRET_KEY: ci-dummy-secret-key
      AUTH_SECRET: ci-dummy-secret-key
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      DJANGO_SECURE_SSL_REDIRECT: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run backend lint
        run: ruff check .

      - name: Django import/config check
        run: python manage.py check

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - lint-frontend
      - lint-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image owner
        id: image-meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            USE_DJANGO_API=true
            DJANGO_API_URL=http://backend:8000
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ steps.image-meta.outputs.owner }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Refresh Server
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: deploy.sh
          target: ${{ env.SERVER_APP_DIR }}
          overwrite: true

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: docker-compose.prod.yml
          target: ${{ env.SERVER_APP_DIR }}
          overwrite: true

      - name: SSH and run deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ${{ env.SERVER_APP_DIR }}
            chmod +x deploy.sh
            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            if [ -z "$GHCR_USERNAME" ]; then
              GHCR_USERNAME="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            fi
            if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "Missing required GitHub secret: GHCR_TOKEN"
              echo "Create a GitHub PAT with read:packages and add it to this repo."
              exit 1
            fi
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            GHCR_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" IMAGE_TAG=latest bash deploy.sh
