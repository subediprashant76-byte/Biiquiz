name: host-biiquiz

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:-basan-ta}/host-biiquiz-frontend:${IMAGE_TAG:-latest}
    container_name: host-biiquiz-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env.production
    environment:
      NEXT_PUBLIC_API_URL: /api
      USE_DJANGO_API: "true"
      DJANGO_API_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    networks:
      - app_net

  backend:
    image: ghcr.io/${GHCR_OWNER:-basan-ta}/host-biiquiz-backend:${IMAGE_TAG:-latest}
    container_name: host-biiquiz-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    env_file:
      - ./backend/.env.production
    environment:
      GUNICORN_BIND: 0.0.0.0:8000
      HEALTHCHECK_HOST: host.biiquiz.com
      DJANGO_RUNTIME: docker
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: host-biiquiz-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
